<title>Create lifi-contracts-tron-sync GitHub App</title>
<p>Redirecting to GitHub to create the app from the manifest&hellip;</p>
<form id="manifest-form" action="https://github.com/organizations/lifinance/settings/apps/new" method="post">
  <input type="hidden" name="manifest" value='{
  "name": "lifi-contracts-tron-sync",
  "url": "https://github.com/lifinance/contracts-tron",
  "redirect_url": "https://github.com/lifinance/contracts-tron",
  "public": false,
  "default_permissions": {
    "contents": "write",
    "pull_requests": "write",
    "metadata": "read"
  },
  "default_events": []
}'>
  <noscript><button type="submit">Continue</button></noscript>
</form>
<script>document.getElementById("manifest-form").submit();</script>
