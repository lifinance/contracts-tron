# Sync upstream contracts
# - Keeps contracts-tron:main up to date with lifinance/contracts:main (one-way, upstream -> fork)
# - This workflow never creates a commit (EXSC-1019). It publishes upstream's own
#   commits - which are already signed - to a sync branch, and lets GitHub build
#   the merge commit server-side, where it is signed automatically. A merge commit
#   made locally by the app would be unsigned: an app's [bot] identity is not an
#   account, so there is no key to register for it and no way to make a local
#   `git commit -S` produce a GitHub-verified signature.
# - Clean merge: runs the full forge test suite against the merge result first;
#   only if tests pass does it advance main through the REST "merge a branch"
#   endpoint. Requires the app to be added as a bypass actor on the "main
#   protection" ruleset (manual one-time setup, see EXSC-587/EXSC-599) - otherwise
#   this merge is rejected and the job fails.
# - Clean merge but failing tests: does NOT touch main; hands upstream's commits to
#   sync/upstream-YYYY-MM-DD-<run>-<attempt> and opens a PR so the breakage is reviewed with
#   all required checks applied (EXSC-603)
# - Conflicting merge: opens the same PR and lists the conflicting paths in the
#   body for whoever resolves it. Conflict markers are never committed.
# - Sync PRs must be merged WITH A MERGE COMMIT. Squash and rebase drop the
#   upstream parent, so the merge base never advances and every later sync
#   re-conflicts on the whole fork delta.
# - Known limitation: the pre-merge test run is the same suite as forge-unit-tests.yml
#   but unsharded (single runner) - slower, which is acceptable for a weekly job
# - Known cost, accepted: the clean path now pushes a short-lived branch, and
#   networkRpcsChecker.yml declares a bare `push:` with no branches filter, so each
#   green sync triggers one extra RPC-check run for a branch deleted seconds later.
#   That filter belongs in networkRpcsChecker.yml, which is upstream-owned and
#   byte-identical to lifinance/contracts - changing it here would manufacture a
#   fork delta on a file that has none. Fix it upstream, not in this repo.
name: Sync upstream contracts

concurrency:
  group: sync-upstream-contracts
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {} # manual trigger for testing / on-demand syncs

permissions: {} # no default access; each job declares what it needs

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the sync branch and merge it into main
      pull-requests: write # required to open a PR on merge conflicts
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TRON_SYNC_APP_ID }}
          private-key: ${{ secrets.TRON_SYNC_APP_PRIVATE_KEY }}
          # Narrow the token to what this job does; without these it inherits
          # every permission the installation holds.
          permission-contents: write # push the sync branch, merge it into main, delete the branch
          permission-pull-requests: write # open the hand-off PRs
          # Upstream syncs routinely carry .github/workflows changes (16 files in the
          # last one). Without this, git rejects the sync-branch push outright:
          # "refusing to allow a GitHub App to ... without `workflows` permission".
          permission-workflows: write

      - name: Checkout contracts-tron
        # persist-credentials stays on (the zizmor "artipacked" default): the sync
        # branch is pushed with git, which needs the app token left in the remote.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Fetch upstream lifinance/contracts
        run: |
          git remote add upstream https://github.com/lifinance/contracts.git
          git fetch upstream main

      - name: Attempt merge
        id: merge
        env:
          RUN_NUMBER: ${{ github.run_number }}
          # run_number is identical across re-runs of the same run, so the branch
          # name needs the attempt too or "Re-run failed jobs" collides with the
          # branch the first attempt already pushed.
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          ##### Assigned first, not inlined into the echo below: a failing
          ##### substitution inside `echo` still exits 0, which would write an empty
          ##### value and surface several steps later as a mangled commit message.
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          BASE_SHA=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%d)

          {
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "date=${DATE}"
            echo "branch=sync/upstream-${DATE}-${RUN_NUMBER}-${RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo -e "\033[32mAlready up to date with upstream, nothing to sync\033[0m"
            echo "verdict=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ##### --no-commit --no-ff resolves the merge into the working tree so the
          ##### suite can run against it, without ever creating a commit. --no-ff is
          ##### required: a fast-forward cannot be stopped by --no-commit alone.
          if git merge upstream/main --no-commit --no-ff; then
            echo -e "\033[32mClean merge, no conflicts\033[0m"
            ##### Record the tree the suite is about to run against, so the merge
            ##### GitHub builds later can be checked against it.
            MERGED_TREE=$(git write-tree)
            {
              echo "verdict=clean"
              echo "merged_tree=${MERGED_TREE}"
            } >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-files --unmerged)" ]; then
            echo -e "\033[31mMerge conflicts detected, will hand off to a PR\033[0m"
            echo "verdict=conflict" >> "$GITHUB_OUTPUT"
          else
            ##### git merge also exits non-zero for unrelated histories, a dirty
            ##### tree, or a failed submodule merge. Those leave no unmerged paths,
            ##### so treating them as conflicts would open a PR with an empty
            ##### conflict list and bury the real error in the log.
            echo -e "\033[31mgit merge failed with no conflicting paths; this is not a content conflict - see the error above\033[0m" >&2
            exit 1
          fi

      ##### Pre-merge verification (EXSC-603): a textually clean merge can still
      ##### break the fork (Tron-specific divergence vs upstream changes), so the
      ##### full test suite must pass against the merge result before anything
      ##### lands on main. Setup mirrors forge-unit-tests.yml, unsharded.
      - name: Sync submodules to merge result
        if: steps.merge.outputs.verdict == 'clean'
        run: git submodule update --init --recursive

      - name: Set up Bun
        if: steps.merge.outputs.verdict == 'clean'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dev dependencies
        if: steps.merge.outputs.verdict == 'clean'
        run: bun install --frozen-lockfile

      - name: Install Foundry
        if: steps.merge.outputs.verdict == 'clean'
        uses: ./.github/actions/setup-foundry
        with:
          cache-key-suffix: sync-upstream

      - name: Install forge Dependencies
        if: steps.merge.outputs.verdict == 'clean'
        run: forge install

      - name: Fetch RPC endpoints from MongoDB
        if: steps.merge.outputs.verdict == 'clean'
        run: |
          # Run the fetch-rpcs.ts script to update .env with RPC endpoint variables
          # This will fetch prioritized RPCs from MongoDB, or fall back to public RPCs from networks.json if MongoDB is unavailable
          bun fetch-rpcs
          # Only inject RPC endpoint variables into the GitHub Actions environment.
          # Mask the URL (which may carry an API key) before forwarding so it is
          # redacted from all subsequent log output for the rest of the run.
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" =~ ^ETH_NODE_URI_ ]]; then
              value="${line#*=}"
              # Strip optional surrounding quotes so the masked token matches what tools print.
              if [[ "$value" == \"*\" ]]; then value="${value:1:-1}"; fi
              if [[ "$value" == \'*\' ]]; then value="${value:1:-1}"; fi
              echo "::add-mask::$value"
              echo "$line" >> "$GITHUB_ENV"
            fi
          done < ".env"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Run forge tests against merge result
        id: verify
        if: steps.merge.outputs.verdict == 'clean'
        # continue-on-error so a red suite routes to the PR-handoff step below
        # instead of failing the job before the merge result is preserved
        continue-on-error: true
        shell: bash
        env:
          FOUNDRY_PROFILE: ci
        run: |
          set -euo pipefail
          # retry failed tests up to 10 times (RPC flakiness), same as forge-unit-tests.yml
          forge test && exit 0
          for i in $(seq 1 10); do
            echo "::group::Retry $i/10: forge test --rerun"
            sleep 15
            forge test --rerun && exit 0
            echo "::endgroup::"
          done
          exit 1

      - name: Advance main to the merge result
        id: advance
        if: steps.merge.outputs.verdict == 'clean' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          MERGED_TREE: ${{ steps.merge.outputs.merged_tree }}
        run: |
          set -euo pipefail

          ##### main must still be where it was when the suite ran, or the commit
          ##### GitHub builds below is not the tree forge tested.
          git fetch origin main
          CURRENT_SHA=$(git rev-parse origin/main)
          if [ "${CURRENT_SHA}" != "${BASE_SHA}" ]; then
            echo -e "\033[31mmain moved from ${BASE_SHA} to ${CURRENT_SHA} while the suite ran; refusing to merge an untested result\033[0m" >&2
            exit 1
          fi

          ##### Publish upstream's commits under a branch in this repo so the merge
          ##### endpoint can reach them. This creates no new commit - every commit on
          ##### the branch is upstream's own, and already signed.
          ##### --no-verify: `bun install` above set core.hooksPath, and .husky/pre-push
          ##### type-checks a diff range that no longer matches what is being pushed.
          ##### Nothing here is bot-authored, so the hook has nothing to vet.
          git push --no-verify origin "refs/remotes/upstream/main:refs/heads/${BRANCH}"

          ##### GitHub builds the merge commit, so it carries GitHub's signature and
          ##### satisfies the required_signatures rule on main (EXSC-1019).
          MERGE_SHA=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main \
            -f head="${BRANCH}" \
            -f commit_message="chore: sync upstream contracts@${UPSTREAM_SHA}" \
            -q .sha)

          ##### /merges answers 204 (empty body) when base already contains head,
          ##### which gh reports as success. Without this the empty SHA falls through
          ##### to the tree check and reports a tree mismatch that never happened.
          if [ -z "${MERGE_SHA}" ]; then
            echo -e "\033[31m/merges returned no commit (204: main already contains ${BRANCH}); nothing was merged\033[0m" >&2
            exit 1
          fi

          ##### GitHub resolves the merge on its own side, so the tree it produced is
          ##### not automatically the tree forge ran against. Fail loudly if they
          ##### differ rather than call an untested tree a successful sync.
          #####
          ##### Note this check is necessarily post-hoc: /merges takes no expected-base
          ##### parameter, so the base-SHA guard above and the POST cannot be made
          ##### atomic. If main moves in that window, main ends up carrying a merge
          ##### commit the suite never ran against and a human has to decide whether to
          ##### revert it - hence the two messages below distinguishing the cases.
          git fetch origin main

          ##### Resolved into variables rather than inlined into the `if`: inside a
          ##### test expression errexit is suppressed, so an unreachable object would
          ##### yield "" and be reported as a race that never happened.
          MERGE_TREE=$(git rev-parse "${MERGE_SHA}^{tree}")
          MERGE_PARENT=$(git rev-parse "${MERGE_SHA}^1")

          if [ "${MERGE_TREE}" != "${MERGED_TREE}" ]; then
            if [ "${MERGE_PARENT}" != "${BASE_SHA}" ]; then
              echo -e "\033[31mmain moved to ${MERGE_PARENT} between the base check and the merge; ${MERGE_SHA} is now ON MAIN but was never tested - revert or re-run\033[0m" >&2
            else
              echo -e "\033[31m${MERGE_SHA} is ON MAIN but carries a different tree than the suite tested (${MERGED_TREE}); GitHub resolved the merge differently - needs review\033[0m" >&2
            fi
            exit 1
          fi

      ##### Runs whether or not the merge succeeded: a branch left behind by a failed
      ##### POST or a failed tree check is never reused (the name carries the run
      ##### number), so it would linger forever. Tolerant of an already-deleted ref -
      ##### a failed cleanup must not turn a sync that did land into a red job.
      - name: Delete the sync branch
        if: always() && steps.advance.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            || echo "sync branch ${BRANCH} was already gone or could not be deleted; continuing"

      - name: Hand off failing merge to PR
        id: handoff-tests
        # Clean merge but red tests: never touch main; hand upstream's commits to a
        # sync branch and open a PR where all required checks + review apply
        if: steps.merge.outputs.verdict == 'clean' && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          DATE: ${{ steps.merge.outputs.date }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          ##### --no-verify: the .husky/pre-push hook installed by `bun install` above
          ##### type-checks script/**, so an upstream change that breaks type-checking
          ##### would block the very PR that exists to surface that breakage.
          git push --no-verify origin "refs/remotes/upstream/main:refs/heads/${BRANCH}"

          cat > pr-body.md <<BODY
          Automated sync from \`lifinance/contracts@${UPSTREAM_SHA}\` merged cleanly but the
          forge test suite FAILED against the merge result, so it was not merged into
          \`main\`. Test log: ${RUN_URL}

          This branch carries upstream's history as-is, with no bot-authored commit, so
          every commit on it is already signed.

          **The branch alone is green.** It is \`upstream/main\` verbatim and carries none
          of the fork delta, so the failure only exists in the *merge* of this branch with
          \`main\`. Reproduce it that way before fixing anything:

          \`\`\`bash
          git fetch origin
          git checkout ${BRANCH}
          git merge origin/main --no-edit   # this is the tree the suite failed against
          forge test
          \`\`\`

          Fix the breakage on this branch (or coordinate an upstream fix), then merge via
          the normal review process.

          > [!IMPORTANT]
          > Merge this PR with a **merge commit**. Squash and rebase drop the upstream
          > parent, so the merge base never advances and every later sync re-conflicts
          > on the entire fork delta.

          See the Notion 'Tron deployments' page (section: The contracts-tron Fork) and
          EXSC-587/EXSC-603 for the sync rules.
          BODY

          gh pr create \
            --repo lifinance/contracts-tron \
            --title "chore: sync upstream contracts (${DATE}) - tests failing, review required" \
            --body-file pr-body.md \
            --base main \
            --head "${BRANCH}"

      - name: Open PR for manual conflict resolution
        id: handoff-conflict
        if: steps.merge.outputs.verdict == 'conflict'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          DATE: ${{ steps.merge.outputs.date }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          ##### The conflicted merge is still sitting in the working tree (it was
          ##### never committed), so the unmerged paths are readable here.
          CONFLICTS=$(git diff --name-only --diff-filter=U)

          ##### --no-verify for symmetry with the other push sites; on this path the
          ##### hook is not even installed (bun install never runs when the merge
          ##### conflicts), so relying on that would be relying on an accident.
          git push --no-verify origin "refs/remotes/upstream/main:refs/heads/${BRANCH}"

          cat > pr-body.md <<BODY
          Automated sync from \`lifinance/contracts@${UPSTREAM_SHA}\` hit merge conflicts.

          This branch carries upstream's history as-is - the conflict markers were NOT
          committed - so every commit on it is already signed. Resolve by merging
          \`main\` into the branch and pushing a signed resolution:

          \`\`\`bash
          git fetch origin
          git checkout ${BRANCH}
          git merge origin/main   # resolve the conflicts listed below in your editor
          git add -A              # required: git commit refuses while paths are unmerged
          git commit -S --no-edit
          git push
          \`\`\`

          Conflicting paths:

          \`\`\`
          ${CONFLICTS}
          \`\`\`

          > [!IMPORTANT]
          > Merge this PR with a **merge commit**. Squash and rebase drop the upstream
          > parent, so the merge base never advances and every later sync re-conflicts
          > on the entire fork delta.

          See the Notion 'Tron deployments' page (section: The contracts-tron Fork) and
          EXSC-587 for the sync/versioning rules.
          BODY

          gh pr create \
            --repo lifinance/contracts-tron \
            --title "chore: sync upstream contracts (${DATE}) - conflicts need resolution" \
            --body-file pr-body.md \
            --base main \
            --head "${BRANCH}"

      ##### A sync that never lands is invisible: the job is a weekly cron nobody
      ##### watches, and the two hand-off paths exit successfully. Alert on any run
      ##### that did not reach main, whatever the reason.
      - name: Notify Slack when the sync did not land on main
        if: >-
          always() && (failure()
          || steps.merge.outputs.verdict == 'conflict'
          || steps.verify.outcome == 'failure')
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: contracts-tron upstream sync needs attention - ${{ steps.advance.outcome == 'failure' && format('a merge may be ON MAIN that the suite never ran against; read the run log and revert if so (branch {0} may also still exist)', steps.merge.outputs.branch) || steps.handoff-conflict.outcome == 'success' && 'merge conflicts, PR opened; the fork stays behind lifinance/contracts until it is merged' || steps.handoff-conflict.outcome == 'failure' && format('merge conflicts, but PR creation FAILED; branch {0} is already pushed and can be picked up by hand', steps.merge.outputs.branch) || steps.handoff-tests.outcome == 'success' && 'tests failed against the merge result, PR opened; the fork stays behind lifinance/contracts until it is merged' || steps.handoff-tests.outcome == 'failure' && format('tests failed and PR creation FAILED; branch {0} is already pushed and can be picked up by hand', steps.merge.outputs.branch) || 'the job failed before any merge was attempted; the fork stays behind lifinance/contracts' }}: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}>"
            }
