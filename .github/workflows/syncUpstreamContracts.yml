# Sync upstream contracts
# - Keeps contracts-tron:main up to date with lifinance/contracts:main (one-way, upstream -> fork)
# - Clean merge: runs the full forge test suite against the merge result first; only
#   if tests pass does it push directly to main as the lifi-contracts-tron-sync
#   GitHub App. Requires the app to be added as a bypass actor on the "main
#   protection" ruleset (manual one-time setup, see EXSC-587/EXSC-599) - otherwise
#   this push is rejected and the job fails.
# - Clean merge but failing tests: does NOT push to main; hands the merge commit off
#   to sync/upstream-YYYY-MM-DD-<run> and opens a PR so the breakage is reviewed
#   with all required checks applied (EXSC-603)
# - Conflicting merge: commits the conflict markers to sync/upstream-YYYY-MM-DD-<run>
#   and opens a PR for manual resolution instead
# - Known limitation: the pre-push test run is the same suite as forge-unit-tests.yml
#   but unsharded (single runner) - slower, which is acceptable for a weekly job
name: Sync upstream contracts

concurrency:
  group: sync-upstream-contracts
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {} # manual trigger for testing / on-demand syncs

permissions: {} # no default access; each job declares what it needs

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the merge commit / sync branch
      pull-requests: write # required to open a PR on merge conflicts
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TRON_SYNC_APP_ID }}
          private-key: ${{ secrets.TRON_SYNC_APP_PRIVATE_KEY }}

      - name: Checkout contracts-tron
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "lifi-contracts-tron-sync[bot]"
          git config user.email "lifi-contracts-tron-sync[bot]@users.noreply.github.com"

      - name: Fetch upstream lifinance/contracts
        run: |
          git remote add upstream https://github.com/lifinance/contracts.git
          git fetch upstream main

      - name: Attempt merge
        id: merge
        run: |
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          if git merge upstream/main --no-edit -m "chore: sync upstream contracts@${UPSTREAM_SHA}"; then
            echo -e "\033[32mClean merge, no conflicts\033[0m"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo -e "\033[31mMerge conflicts detected, will hand off to a PR\033[0m"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      ##### Pre-push verification (EXSC-603): a textually clean merge can still
      ##### break the fork (Tron-specific divergence vs upstream changes), so the
      ##### full test suite must pass against the merge result before anything
      ##### lands on main. Setup mirrors forge-unit-tests.yml, unsharded.
      - name: Sync submodules to merge result
        if: steps.merge.outputs.conflict == 'false'
        run: git submodule update --init --recursive

      - name: Set up Bun
        if: steps.merge.outputs.conflict == 'false'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dev dependencies
        if: steps.merge.outputs.conflict == 'false'
        run: bun install --frozen-lockfile

      - name: Install Foundry
        if: steps.merge.outputs.conflict == 'false'
        uses: ./.github/actions/setup-foundry
        with:
          cache-key-suffix: sync-upstream

      - name: Install forge Dependencies
        if: steps.merge.outputs.conflict == 'false'
        run: forge install

      # The .husky/pre-push hook type-checks script/**, which imports generated
      # typechain/ bindings; without them the push below aborts before it reaches
      # the remote. Mirrors validateScripts.yml.
      - name: Generate typechain bindings
        if: steps.merge.outputs.conflict == 'false'
        run: bun typechain:incremental

      - name: Fetch RPC endpoints from MongoDB
        if: steps.merge.outputs.conflict == 'false'
        run: |
          # Run the fetch-rpcs.ts script to update .env with RPC endpoint variables
          # This will fetch prioritized RPCs from MongoDB, or fall back to public RPCs from networks.json if MongoDB is unavailable
          bun fetch-rpcs
          # Only inject RPC endpoint variables into the GitHub Actions environment.
          # Mask the URL (which may carry an API key) before forwarding so it is
          # redacted from all subsequent log output for the rest of the run.
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" =~ ^ETH_NODE_URI_ ]]; then
              value="${line#*=}"
              # Strip optional surrounding quotes so the masked token matches what tools print.
              if [[ "$value" == \"*\" ]]; then value="${value:1:-1}"; fi
              if [[ "$value" == \'*\' ]]; then value="${value:1:-1}"; fi
              echo "::add-mask::$value"
              echo "$line" >> "$GITHUB_ENV"
            fi
          done < ".env"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Run forge tests against merge result
        id: verify
        if: steps.merge.outputs.conflict == 'false'
        # continue-on-error so a red suite routes to the PR-handoff step below
        # instead of failing the job before the merge result is preserved
        continue-on-error: true
        shell: bash
        env:
          FOUNDRY_PROFILE: ci
        run: |
          set -euo pipefail
          # retry failed tests up to 10 times (RPC flakiness), same as forge-unit-tests.yml
          forge test && exit 0
          for i in $(seq 1 10); do
            echo "::group::Retry $i/10: forge test --rerun"
            sleep 15
            forge test --rerun && exit 0
            echo "::endgroup::"
          done
          exit 1

      - name: Push directly to main
        if: steps.merge.outputs.conflict == 'false' && steps.verify.outcome == 'success'
        run: git push origin main

      - name: Hand off failing merge to PR
        # Clean merge but red tests: never push to main; preserve the already-committed
        # merge on a sync branch and open a PR where all required checks + review apply
        if: steps.merge.outputs.conflict == 'false' && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/upstream-${DATE}-${{ github.run_number }}"

          git branch "${BRANCH}"
          git push origin "${BRANCH}"

          gh pr create \
            --repo lifinance/contracts-tron \
            --title "chore: sync upstream contracts (${DATE}) - tests failing, review required" \
            --body "Automated sync from \`lifinance/contracts@${{ steps.merge.outputs.upstream_sha }}\` merged cleanly but the forge test suite FAILED against the merge result, so it was not pushed to main. Test log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix the breakage on this branch (or coordinate an upstream fix), then merge via the normal review process. See the Notion 'Tron deployments' page (section: The contracts-tron Fork) and EXSC-587/EXSC-603 for the sync rules." \
            --base main \
            --head "${BRANCH}"

      - name: Commit conflicts and open PR
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/upstream-${DATE}-${{ github.run_number }}"

          ##### move the current (conflicted) work onto a new branch without
          ##### touching the working tree, then stage the conflict markers as-is
          git branch "${BRANCH}"
          git symbolic-ref HEAD "refs/heads/${BRANCH}"
          git add -A
          git commit -m "chore: sync upstream contracts@${{ steps.merge.outputs.upstream_sha }} (conflicts - manual resolution required)"
          git push origin "${BRANCH}"

          gh pr create \
            --repo lifinance/contracts-tron \
            --title "chore: sync upstream contracts (${DATE}) - conflicts need resolution" \
            --body "Automated sync from \`lifinance/contracts@${{ steps.merge.outputs.upstream_sha }}\` hit merge conflicts. Conflict markers are committed as-is on this branch - resolve them manually. See the Notion 'Tron deployments' page (section: The contracts-tron Fork) and EXSC-587 for the sync/versioning rules." \
            --base main \
            --head "${BRANCH}"

      ##### A sync that never lands is invisible: the job is a weekly cron nobody
      ##### watches, and the two hand-off paths exit successfully. Alert on any run
      ##### that did not push to main, whatever the reason.
      - name: Notify Slack when the sync did not land on main
        if: >-
          always() && (failure()
          || steps.merge.outputs.conflict == 'true'
          || steps.verify.outcome == 'failure')
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_SC_GENERAL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: contracts-tron upstream sync did not reach main (${{ steps.merge.outputs.conflict == 'true' && 'merge conflicts - PR opened' || steps.verify.outcome == 'failure' && 'tests failed - PR opened' || 'job failed' }}): <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}>. The fork stays behind lifinance/contracts until this is resolved."
            }
