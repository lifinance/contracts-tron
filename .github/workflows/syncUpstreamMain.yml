# Upstream Sync (lifinance/contracts -> contracts-tron:main)
# - Keeps `main` close to `lifinance/contracts:main` so this fork picks up upstream
#   commits (security patches, CI fixes, lockfile bumps) without manual intervention.
# - Triggers: daily cron + manual workflow_dispatch
# - Key behaviors:
#     * Mints a short-lived GitHub App token via actions/create-github-app-token.
#         The App must be on the `main` branch ruleset's bypass list in `Pull request`
#         mode so the App can merge sync PRs that don't satisfy review/required-check
#         rules, without granting it permission to bypass other rules (deletion,
#         non_fast_forward).
#     * Happy path (no merge conflict): pushes upstream/main to a `sync/upstream-…`
#         branch, opens a PR, and immediately merges it via the GitHub merge API.
#         The merge commit is auto-signed by GitHub's web-flow key, so the
#         required_signatures rule on `main` is satisfied for real — not bypassed.
#         The sync branch is deleted after merge to keep the branch list clean.
#     * Conflict path: opens (or comments on the existing open) `Upstream sync
#         conflict` issue listing the conflicting files. A human resolves the
#         conflict manually following the embedded instructions.
#     * Scheduled runs are gated by repo variable ENABLE_UPSTREAM_SYNC=="true";
#         manual dispatch always runs.
# - Required repo configuration:
#     * vars.SYNC_APP_ID            — GitHub App ID (number, as repo variable)
#     * vars.ENABLE_UPSTREAM_SYNC   — "true" to enable scheduled runs
#     * secrets.SYNC_APP_PRIVATE_KEY — App private key (PEM)
# - Required App configuration:
#     * Installed on this repo with `Contents: Read & write`,
#         `Pull requests: Read & write`, `Issues: Read & write`, `Metadata: Read`.
#     * Added to the `main` branch ruleset's bypass list with `Pull request`
#         bypass mode (narrower than `Always` — the App can merge PRs that don't
#         satisfy review/check rules, but cannot bypass deletion/non_fast_forward).
# - Known limitations:
#     * Conflict resolution requires a human; the workflow only signals via an issue.
#     * Upstream is assumed to be `https://github.com/lifinance/contracts.git`.

name: Sync upstream to main

on:
  schedule:
    # Daily at 06:17 UTC. Offbeat minute to avoid the :00 wave.
    - cron: '17 6 * * *'
  workflow_dispatch:
    # Allow manual execution by users with write access.

# Prevent overlapping runs; concurrent runs would race on the sync branch / PR.
concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: read # default GITHUB_TOKEN only needs read; all writes go through the App token

jobs:
  sync-upstream:
    # Scheduled runs gated by variable; manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_UPSTREAM_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          # Default scope is this repo, with the permissions granted at App install.

      - name: Checkout repository (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history needed to test the merge locally
          token: ${{ steps.app-token.outputs.token }}
          # The App token replaces GITHUB_TOKEN in .git/config so subsequent
          # `git push` calls authenticate as the App.

      - name: Configure git identity as the sync App
        env:
          APP_ID: ${{ vars.SYNC_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          ##### Identity must match the App for the bypass list to recognize the push.
          # The noreply email uses GitHub's `<APP_ID>+<slug>[bot]` convention.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/lifinance/contracts.git
          git fetch upstream main --no-tags

      - name: Sync via self-merging PR (or open conflict issue)
        env:
          # All ${{ ... }} values flow via env to avoid expansion inside shell
          # (template-injection hardening per repo convention).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          ##### Already up-to-date? (upstream/main fully reachable from main)
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo -e "\033[32m✅ main already includes upstream/main; nothing to sync\033[0m"
            exit 0
          fi

          ##### Dry-run the merge to detect conflicts. We do NOT keep this merge
          # commit — the actual merge is performed on GitHub's side by the merge API
          # so the resulting commit is auto-signed by web-flow.
          if ! git merge --no-ff --no-commit --no-edit upstream/main; then
            CONFLICTS="$(git diff --name-only --diff-filter=U | sort -u)"
            git merge --abort
            echo -e "\033[31m❌ Merge conflict detected in:\033[0m"
            echo "${CONFLICTS}"

            TODAY="$(date -u +%Y-%m-%d)"
            TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            MANUAL_BRANCH="sync/upstream-${TODAY}-manual"

            ISSUE_BODY=$(cat <<EOF
          ## Conflicts during automated upstream sync

          The scheduled \`Sync upstream to main\` workflow detected merge conflicts while merging \`lifinance/contracts:main\` into \`main\`.

          **Detected at:** ${TIMESTAMP}
          **Workflow run:** ${RUN_URL}

          ### Conflicting files

          \`\`\`
          ${CONFLICTS}
          \`\`\`

          ### How to resolve

          \`\`\`bash
          git fetch upstream
          git checkout -b ${MANUAL_BRANCH} main
          git merge upstream/main
          # resolve conflicts in the files listed above
          git push origin ${MANUAL_BRANCH}
          gh pr create --base main --head ${MANUAL_BRANCH} \\
            --title "chore(sync): merge upstream into main" \\
            --body "Resolves conflicts from upstream sync issue #<this issue number>."
          \`\`\`

          Close this issue once the PR is merged.
          EOF
            )

            ##### Avoid spamming: comment on the existing open issue instead of creating a duplicate.
            EXISTING="$(gh issue list \
              --repo "${REPO}" \
              --state open \
              --search 'Upstream sync conflict in:title' \
              --json number --jq '.[0].number' || true)"

            if [ -n "${EXISTING}" ]; then
              echo "Updating existing issue #${EXISTING}"
              gh issue comment "${EXISTING}" \
                --repo "${REPO}" \
                --body "${ISSUE_BODY}"
            else
              echo "Opening new conflict issue"
              gh issue create \
                --repo "${REPO}" \
                --title "Upstream sync conflict — ${TODAY}" \
                --body "${ISSUE_BODY}"
            fi

            ##### Fail the run so the conflict is visible in the Actions UI as well.
            exit 1
          fi

          ##### No conflict — discard the dry-run merge.
          git merge --abort

          ##### Happy path: push upstream/main as a sync branch, open PR, merge via API.
          TODAY="$(date -u +%Y-%m-%d)"
          BRANCH="sync/upstream-${TODAY}-${RUN_ID}"

          echo "Pushing upstream/main to ${BRANCH}"
          git push origin "refs/remotes/upstream/main:refs/heads/${BRANCH}"

          PR_BODY=$(cat <<EOF
          Automated upstream sync from \`lifinance/contracts:main\`.

          This PR is opened and merged by the \`Sync upstream to main\` workflow run ${RUN_URL}.

          The merge commit is created by GitHub's merge API and auto-signed by GitHub's web-flow key, satisfying the \`required_signatures\` rule on \`main\` without bypass. The App's \`Pull request\` mode bypass lets the merge succeed despite the unrelated required-check failures that would otherwise block sync PRs.
          EOF
          )

          PR_URL="$(gh pr create \
            --repo "${REPO}" \
            --base main \
            --head "${BRANCH}" \
            --title "chore(sync): merge upstream/main into main" \
            --body "${PR_BODY}")"
          PR_NUMBER="${PR_URL##*/}"
          echo "Opened PR #${PR_NUMBER}: ${PR_URL}"

          ##### Merge the PR. With Pull request bypass, this succeeds despite
          # unmet review/check requirements. GitHub creates and signs the merge commit.
          echo "Merging PR #${PR_NUMBER} via API"
          gh api -X PUT "/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f commit_title="chore(sync): merge upstream/main into main (#${PR_NUMBER})"

          ##### Clean up the sync branch (best-effort; failure is non-fatal).
          git push origin --delete "${BRANCH}" || \
            echo "::warning::Could not delete ${BRANCH}; clean up manually"

          echo -e "\033[32m✅ Synced via PR #${PR_NUMBER}\033[0m"
