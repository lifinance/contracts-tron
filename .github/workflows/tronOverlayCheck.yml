# Tron Overlay Check (EXSC-858)
# - Fails a sync/upstream-* PR if the merge would drop a Tron overlay: every
#   src/**/*.sol file with a "-tron" @custom:version on main must still exist,
#   keep the suffix, keep code that differs from upstream, and carry upstream's
#   version before the suffix. Logic: script/tasks/checkTronOverlays.ts.
# - Runs on every PR to main so it can be a required check, but only sync
#   branches are checked; on any other branch the job passes without checking.
#   Ordinary PRs that edit an overlay are reviewed and audit-gated already.
# - Checks the PR merge ref (what would land on main) against the upstream
#   commit the branch carries - merge-base with upstream/main - not the live
#   upstream tip, so upstream moving on after the sync is not a failure.
# - Re-runs on every push (a conflict resolution) and on label changes. The
#   tron-overlay-change-accepted label turns failures into printed overrides,
#   for a deliberate rebase or retirement of an overlay.

name: Tron Overlay Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: tron-overlay-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tron-overlay-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # required to fetch repository contents
    steps:
      - name: Decide whether this PR is a sync
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" == sync/upstream-* ]]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo -e "\033[32m${HEAD_REF} is not an upstream sync branch; nothing to check\033[0m"
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        if: steps.scope.outputs.sync == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # merge-base needs the full history of both sides

      - name: Fetch upstream lifinance/contracts
        if: steps.scope.outputs.sync == 'true'
        run: git fetch --no-tags https://github.com/lifinance/contracts.git main:refs/remotes/upstream/main

      - name: Set up Bun
        if: steps.scope.outputs.sync == 'true'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.scope.outputs.sync == 'true'
        run: bun install --frozen-lockfile

      - name: Check Tron overlays
        if: steps.scope.outputs.sync == 'true'
        env:
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'tron-overlay-change-accepted') }}
        run: |
          set -euo pipefail
          ##### HEAD is the PR merge ref: HEAD^1 is main, HEAD is what would land.
          UPSTREAM=$(git merge-base HEAD upstream/main)
          FLAGS=()
          if [ "${ACCEPTED}" = true ]; then
            echo -e "\033[33mtron-overlay-change-accepted is set; failed checks are reported, not enforced\033[0m"
            FLAGS+=(--accept-overlay-change)
          fi
          bunx tsx script/tasks/checkTronOverlays.ts \
            --before HEAD^1 --after HEAD --upstream "${UPSTREAM}" "${FLAGS[@]}"
